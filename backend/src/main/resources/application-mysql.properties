# === Perfil "mysql" ===
# Ejecutar con:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Requiere un servidor MySQL 8+ en ejecucion. La base "urbanalert" se crea sola si no existe.
# DB_URL, DB_USER y DB_PASSWORD se pueden definir como variables de entorno o en backend/.env.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/urbanalert?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
