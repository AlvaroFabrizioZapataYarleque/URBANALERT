# === UrbanAlert API - Configuracion (AP2: persistencia + seguridad) ===

spring.application.name=urbanalert-api
server.port=8080

# --- Base de datos: H2 en memoria (por defecto). Para MySQL usar el perfil "mysql" ---
spring.datasource.url=jdbc:h2:mem:urbanalertdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 (solo desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Buena practica: las relaciones LAZY se resuelven dentro de la capa de servicio (@Transactional),
# no durante el renderizado de la respuesta.
spring.jpa.open-in-view=false

# --- Variables locales ---
# Lee backend/.env si existe (copiar de .env.example). Las variables de entorno del sistema tienen prioridad.
spring.config.import=optional:file:.env[.properties]

# --- JWT ---
# Secreto en Base64 de al menos 256 bits. Es OBLIGATORIO: no hay valor por defecto en el repositorio.
# Generar uno con:  openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
# Vigencia del token en milisegundos (2 horas por defecto)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# --- CORS (para el futuro frontend en Angular) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
